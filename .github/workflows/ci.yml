name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha test file(s) to run instead of the full suite'
        required: false
        default: ''

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [ '12', '14', '16' ]

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true

    - run: npm install

    - name: Test
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          npx mocha ${{ inputs.test-filter }}
        else
          npm test
        fi

    - name: Create coverage report
      run: npm run report-coveralls

    - name: Pack
      if: matrix.node-version == '16'
      run: npm pack

    - name: Upload package
      if: matrix.node-version == '16'
      uses: actions/upload-artifact@v4
      with:
        name: probe-image-size-tgz
        path: probe-image-size-*.tgz
        if-no-files-found: error
